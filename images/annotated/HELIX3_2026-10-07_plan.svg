<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="880" viewBox="0 0 1400 880" role="img" aria-labelledby="title description">
  <title id="title">HELIX H-3 October 7 excavation plan and New Brunswick street context</title>
  <desc id="description">Schematic north-up map placing H-3 between Kirkpatrick and Spring Streets near Paterson Street. A larger detail shows the concrete-covered deepest pit, the higher unpoured bench, the small excavator to the northeast, an isolated shaft head within the new concrete, and the southeast access position reported by the observer. Not a survey.</desc>
