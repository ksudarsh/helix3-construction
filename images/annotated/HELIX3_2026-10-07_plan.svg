    <pattern id="earth" width="16" height="16" patternUnits="userSpaceOnUse"><rect width="16" height="16" fill="#dfaa75"/><circle cx="3" cy="5" r="1.5" fill="#c4834e" opacity=".48"/><circle cx="12" cy="13" r="1" fill="#c4834e" opacity=".5"/></pattern>
    <pattern id="concrete" width="12" height="12" patternUnits="userSpaceOnUse"><rect width="12" height="12" fill="#aab5b6"/><path d="M0 12L12 0" stroke="#ced7d4" opacity=".4"/></pattern>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="5" refY="5" orient="auto"><path d="M1 9L5 1 9 9" fill="none" stroke="#112e3e" stroke-width="2"/></marker>
  </defs>
